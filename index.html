<!doctype html>
<html lang="en">
<head>

  <title>Weekly Dashboard</title>
  <style>
    :root {
      --text: rgb(55, 53, 47);
      --muted: rgba(55, 53, 47, .65);
      --faint: rgba(55, 53, 47, .09);
      --hover: rgba(55, 53, 47, .055);
      --orange-bg: rgb(250, 222, 201);
      --gray-bg: rgb(241, 241, 239);
    }
    * { box-sizing: border-box; }
    html { background: #fff; }
    body {
      margin: 0;
      color: var(--text);
      background: #fff;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    .topbar {
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
    }
    .crumb {
      max-width: calc(100vw - 170px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 500;
    }
    .notion-link {
      text-decoration: none;
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 14px;
    }
    .notion-link:hover { background: var(--hover); }
    .cover {
      width: 100%;
      height: min(30vh, 280px);
      min-height: 190px;
      margin-top: 45px;
      overflow: hidden;
      background: var(--gray-bg);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .page {
      width: min(100% - 48px, 1180px);
      margin: 0 auto;
      padding: 48px 0 18vh;
    }
    .page-title {
      margin: 0 0 30px;
      font-size: clamp(34px, 5vw, 42px);
      line-height: 1.2;
      letter-spacing: -.03em;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .page-meta { display: flex; gap: 8px; margin: -18px 0 28px; color: var(--muted); font-size: 13px; }
    .block { margin: 1px 0; min-height: 1.5em; }
    .paragraph { padding: 3px 2px; line-height: 1.5; }
    .empty { min-height: 26px; }
    .quote {
      border-left: 3px solid currentColor;
      padding: 3px 14px;
      margin: 8px 0 18px;
      font-size: 1.05em;
      line-height: 1.5;
    }
    h1.block, h2.block, h3.block { color: var(--text); padding: 3px 2px; }
    h1.block { font-size: 1.875em; margin: 30px 0 4px; }
    h2.block { font-size: 1.5em; margin: 24px 0 3px; }
    h3.block { font-size: 1.25em; margin: 20px 0 2px; }
    .divider { height: 1px; background: rgba(55,53,47,.16); margin: 8px 0; }
    .columns { display: flex; gap: 46px; align-items: flex-start; width: 100%; }
    .column { flex: 1 1 0; min-width: 0; }
    .callout {
      display: grid;
      grid-template-columns: 24px minmax(0,1fr);
      gap: 8px;
      border-radius: 3px;
      padding: 14px 16px;
      margin: 4px 0;
      line-height: 1.45;
      background: var(--gray-bg);
    }
    .callout.orange_background { background: var(--orange-bg); }
    .callout.default_background { background: var(--gray-bg); }
    .callout-icon { width: 24px; font-size: 20px; line-height: 1.25; }
    .callout-title { font-weight: 600; min-height: 1.5em; }
    .callout-children { margin-top: 5px; }
    .todo, .list-item {
      display: grid;
      grid-template-columns: 20px minmax(0,1fr);
      gap: 4px;
      padding: 3px 2px;
      min-height: 28px;
      line-height: 1.45;
    }
    .todo-box {
      appearance: none;
      width: 16px;
      height: 16px;
      margin: 3px 0 0;
      border: 1.4px solid rgba(55,53,47,.6);
      border-radius: 2px;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .todo.done .todo-box { border-color: rgb(35,131,226); background: rgb(35,131,226); }
    .todo.done .todo-box::after { content: "✓"; color: #fff; font-size: 12px; line-height: 1; }
    .todo.done .todo-text { text-decoration: line-through; color: rgba(55,53,47,.55); }
    .bullet { text-align: center; line-height: 1.3; font-size: 19px; }
    details.toggle { padding: 3px 2px; }
    details.toggle > summary { cursor: pointer; list-style: none; display: flex; gap: 6px; line-height: 1.5; }
    details.toggle > summary::-webkit-details-marker { display: none; }
    details.toggle > summary::before { content: "▶"; color: var(--muted); font-size: 10px; margin-top: 5px; width: 14px; text-align: center; }
    details.toggle[open] > summary::before { transform: rotate(90deg); }
    .toggle-children { padding-left: 20px; }
    .page-link {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 3px 2px;
      color: inherit;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: rgba(55,53,47,.25);
      text-underline-offset: 3px;
    }
    .notion-image { width: 100%; margin: 8px 0; }
    .notion-image img { display: block; max-width: 100%; max-height: 720px; object-fit: contain; border-radius: 1px; }
    .embed-wrap { width: 100%; min-height: 90px; margin: 8px 0; overflow: hidden; }
    .embed-wrap iframe { width: 100%; height: 110px; border: 0; }
    .rich.bold { font-weight: 700; }
    .rich.italic { font-style: italic; }
    .rich.strikethrough { text-decoration: line-through; }
    .rich.underline { text-decoration: underline; }
    .rich.code { background: rgba(135,131,120,.15); color: #eb5757; border-radius: 3px; padding: .15em .3em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 85%; }
    .rich-link { color: inherit; text-decoration: underline; text-decoration-color: rgba(55,53,47,.35); text-underline-offset: 2px; }
    .synced { color: var(--muted); font-size: 12px; padding: 16px 2px 0; }
    .unsupported { display: none; }
    @media (max-width: 760px) {
      .cover { height: 190px; min-height: 150px; }
      .page { width: min(100% - 30px, 1180px); padding-top: 32px; }
      .page-title { margin-bottom: 24px; }
      .columns { flex-direction: column; gap: 14px; }
      .column { width: 100%; }
      .callout { padding: 12px; }
      .topbar { padding-inline: 8px; }
    }
  </style>
</head>

    const escapeHtml = (value='') => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    function renderRich(parts=[]) {
      return parts.map(part => {
        const a = part.annotations || {};
        const classes = ['rich', ...['bold','italic','strikethrough','underline','code'].filter(k => a[k])].join(' ');
        const text = escapeHtml(part.text || '');
        return part.href ? `<a class="${classes} rich-link" href="${escapeHtml(part.href)}" target="_blank" rel="noopener">${text}</a>` : `<span class="${classes}">${text}</span>`;
      }).join('');
    }

    function renderChildren(children=[]) { return children.map(renderBlock).join(''); }

    function renderBlock(block) {
      const type = block.type || 'unsupported';
      const rich = renderRich(block.rich || []);
      const children = renderChildren(block.children || []);
      if (type === 'paragraph') return `<div class="block paragraph ${rich ? '' : 'empty'}">${rich}${children}</div>`;
      if (type === 'quote') return `<blockquote class="block quote">${rich}${children}</blockquote>`;
      if (type === 'heading_1') return `<h1 class="block">${rich}</h1>${children}`;
      if (type === 'heading_2') return `<h2 class="block">${rich}</h2>${children}`;
      if (type === 'heading_3') return `<h3 class="block">${rich}</h3>${children}`;
      if (type === 'divider') return '<div class="block divider"></div>';
      if (type === 'column_list') return `<div class="block columns">${children}</div>`;
      if (type === 'column') return `<section class="column">${children}</section>`;
      if (type === 'callout') return `<aside class="block callout ${escapeHtml(block.color || 'default_background')}"><div class="callout-icon">${escapeHtml(block.icon || '💡')}</div><div><div class="callout-title">${rich}</div><div class="callout-children">${children}</div></div></aside>`;
      if (type === 'to_do') return `<div class="block todo ${block.checked ? 'done' : ''}"><span class="todo-box"></span><div class="todo-text">${rich || '&nbsp;'}${children}</div></div>`;
      if (type === 'bulleted_list_item') return `<div class="block list-item"><span class="bullet">•</span><div>${rich}${children}</div></div>`;
      if (type === 'numbered_list_item') return `<div class="block list-item"><span>${escapeHtml(block.number || '1.')}</span><div>${rich}${children}</div></div>`;
      if (type === 'toggle') return `<details class="block toggle"><summary>${rich || 'Toggle'}</summary><div class="toggle-children">${children}</div></details>`;
      if (type === 'child_page' || type === 'child_database') return `<a class="block page-link" href="${escapeHtml(block.url || notionPage.url)}" target="_blank" rel="noopener"><span>${type === 'child_database' ? '🗄️' : '📄'}</span><span>${escapeHtml(block.title || 'Untitled')}</span></a>${children}`;
      if (type === 'image' && block.src) return `<figure class="block notion-image"><img src="${escapeHtml(block.src)}" alt="${escapeHtml(block.caption || '')}" loading="lazy" />${block.caption ? `<figcaption>${escapeHtml(block.caption)}</figcaption>` : ''}</figure>`;
      if (type === 'embed' && block.url) return `<div class="block embed-wrap"><iframe src="${escapeHtml(block.url)}" loading="lazy" title="Embedded Notion content"></iframe></div>`;
      return `<div class="unsupported">${children}</div>`;
    }

    document.title = notionPage.title || 'Weekly Dashboard';
    document.getElementById('pageTitle').textContent = notionPage.title || 'Weekly Dashboard';
    document.getElementById('crumb').textContent = notionPage.title || 'Weekly Dashboard';
    document.getElementById('notionLink').href = notionPage.url || '#';
    if (notionPage.cover) {
      document.getElementById('cover').hidden = false;
      document.getElementById('coverImage').src = notionPage.cover;
    }
    const date = notionPage.date || {};
    document.getElementById('pageMeta').textContent = date.start ? `${date.start}${date.end && date.end !== date.start ? ` → ${date.end}` : ''}` : '';
    document.getElementById('blocks').innerHTML = renderChildren(notionPage.blocks || []);
    document.getElementById('synced').textContent = notionPage.syncedAt ? `Mirrored from Notion · ${new Date(notionPage.syncedAt).toLocaleString('en-SG', {timeZone:'Asia/Singapore', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'})}` : '';
